name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m compileall scientific_data_audit/src scientific_data_release/src
      - run: python -m pytest -m "not requires_authoritative_data"
      - run: python examples/synthetic/build.py --output build-one
      - run: python examples/synthetic/build.py --output build-two
      - run: cmp build-one/synthetic_release.tsv build-two/synthetic_release.tsv
      - run: python -c "from pathlib import Path; text='\n'.join(p.read_text(errors='ignore') for p in Path('.').rglob('*') if p.is_file() and p.suffix in {'.py','.md','.toml','.yml','.json'}); assert '__DATA_DOI__' not in text"
      - run: python -c "from pathlib import Path; text='\n'.join(p.read_text(errors='ignore') for p in Path('.').rglob('*') if p.is_file() and p.suffix in {'.py','.md','.toml','.yml','.json'}); assert 'C:' + chr(92) + 'Users' + chr(92) not in text"
